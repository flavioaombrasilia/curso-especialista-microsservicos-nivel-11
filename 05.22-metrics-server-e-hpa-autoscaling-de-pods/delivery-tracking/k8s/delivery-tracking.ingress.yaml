apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # mesmo nome dos outros dois manifestos de propósito: cada `apply` SUBSTITUI o
  # anterior, em vez de acumular Ingress no cluster. Sem isso, a regra catch-all
  # do 01 (host `*`, path `/`) continuaria valendo e competindo com as de host.
  name: algadelivery
spec:
  ingressClassName: traefik
  rules:
    - host: delivery-tracking.algashop.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: delivery-tracking
                port:
                  name: http
