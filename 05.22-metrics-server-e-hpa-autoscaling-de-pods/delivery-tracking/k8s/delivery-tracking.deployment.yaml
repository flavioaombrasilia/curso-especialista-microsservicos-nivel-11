apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-tracking
  labels:
    app: delivery-tracking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery-tracking
  template:
    metadata:
      labels:
        app: delivery-tracking      # e ESTA label que o selector do Service procura (5.07)
    spec:
      containers:
      - name: delivery-tracking
        image: delivery-tracking:v1.0.0
        ports:
          - name: http      # porta nomeada: permite `targetPort: http` no Service
            containerPort: 8080
        env:
          - name: JAVA_TOOL_OPTIONS
            value: "-XX:MaxRAMPercentage=75.0"   # deixa ~25% do container fora do heap (5.19, bloco 4)
        envFrom:
          - configMapRef:
              name: delivery-tracking-configmap
          - secretRef:
              name: delivery-tracking-secret
        resources:
          requests:
            cpu: "250m"        # base do calculo do HPA, mais a frente no modulo
            memory: "512Mi"
          limits:
            memory: "512Mi"    # memoria: teto igual ao request, sem surpresa
            cpu: "1000m"       # cpu: teto folgado, para picos nao virarem latencia
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 5
          failureThreshold: 30        # ate 150s de boot — Spring Boot + JPA sobe nisso
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
          failureThreshold: 3         # 30s de tolerancia depois de pronto
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 5
          failureThreshold: 2         # sai do rodizio em 10s
          timeoutSeconds: 2
