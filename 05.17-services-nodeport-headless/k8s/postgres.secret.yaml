# O MESMO Secret da 5.15 — reaproveitado sem alteracao (callback direto a 5.13).
# postgres/postgres e senha de laboratorio; o ponto pedagogico e ela nao estar
# dentro do StatefulSet.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-cred
  labels:
    app: postgres
type: Opaque
stringData:                 # texto puro aqui; o K8s codifica em base64
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: deliverydb
