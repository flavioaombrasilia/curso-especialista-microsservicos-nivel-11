# Config de LOG do Spring entregue como ARQUIVO pelo ConfigMap.
# O Deployment aponta SPRING_CONFIG_ADDITIONAL_LOCATION=file:/etc/app/ para ca,
# entao o Spring carrega este arquivo de verdade — ele nao e so um arquivo bonito
# dentro do container.
#
# Vira UMA chave do ConfigMap (nome do arquivo = chave, conteudo = valor):
#   kubectl create configmap app-config --from-file=k8s/config/application.properties
logging.pattern.console=%d{HH:mm:ss.SSS} [config-do-configmap] %-5level %logger{25} - %msg%n
logging.level.org.springframework.web=INFO
