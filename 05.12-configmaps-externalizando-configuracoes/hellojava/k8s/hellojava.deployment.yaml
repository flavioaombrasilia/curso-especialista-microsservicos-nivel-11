apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellojava-config
  labels:
    app: hellojava-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellojava-config
  template:
    metadata:
      labels:
        app: hellojava-config
    spec:
      containers:
      - name: hellojava
        image: hellojava:v5
        env:
          - name: SERVER_PORT
            value: "9091"
          - name: LOG_LEVEL
            value: "DEBUG"
