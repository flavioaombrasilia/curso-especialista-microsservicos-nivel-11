# Credenciais do banco (5.13). Nada sensivel no manifesto do workload.
apiVersion: v1
kind: Secret
metadata:
  name: courier-management-secret
  labels:
    app: courier-management
type: Opaque
stringData:
  # postgres-1, nao postgres-0 — e este e o ponto mais interessante do desafio.
  #
  # O StatefulSet `postgres` da 5.21 subiu com `replicas: 2`, e a 5.15 ja avisou:
  # replica de StatefulSet NAO e replica de dado. `postgres-0` e `postgres-1` sao
  # duas instancias INDEPENDENTES, cada uma com o seu PVC. Ou seja: o cluster ja
  # tinha uma instancia ociosa esperando um segundo servico.
  #
  # Usar uma instancia por servico e o padrao "database per service" — cada
  # microsservico dono do seu esquema, sem ninguem lendo a tabela do vizinho.
  #
  # O banco `courierdb` NAO existe ainda. O `POSTGRES_DB` do Secret do postgres
  # criou `deliverydb` nas duas instancias, e so no PRIMEIRO boot de cada PVC.
  # Antes do primeiro apply deste Deployment:
  #   kubectl exec postgres-1 -- psql -U postgres -c 'CREATE DATABASE courierdb'
  DB_URL: jdbc:postgresql://postgres-1.postgres:5432/courierdb
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
