# Bloco 4 — o Ingress minimo. Quatro perguntas, quatro campos:
#   ingressClassName -> QUEM atende (qual controller)
#   host             -> QUAL site      (ausente aqui: casa qualquer host)
#   path + pathType  -> QUAL rota
#   backend.service  -> PARA ONDE vai  (Service do MESMO namespace)
#
# Repare no que NAO tem aqui: nenhuma anotacao. 100% padrao da API do Kubernetes
# — este manifesto roda igual em Traefik, Contour ou no ALB da AWS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: algadelivery
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hellojava
                port:
                  number: 80
