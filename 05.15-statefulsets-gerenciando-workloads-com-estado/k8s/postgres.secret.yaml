# Credenciais do banco fora do manifesto do workload — callback direto a 5.13.
# E o MESMO formato que a 5.18 vai reaproveitar quando este StatefulSet virar o
# banco do AlgaDelivery.
#
# postgres/postgres e senha de laboratorio. O ponto pedagogico nao e a senha:
# e ela nao estar dentro do StatefulSet. E lembrar que Secret nao e criptografia —
# o que protege e RBAC + encryption-at-rest + gestor externo (Modulo 9).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-cred
  labels:
    app: postgres
type: Opaque
stringData:                 # texto puro aqui; o K8s codifica em base64
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: deliverydb
