# Estado INICIAL do bloco 3: Secret consumido SO por variavel de ambiente.
# Espelho literal do hellojava-config.deployment.yaml da 5.12 — trocando
# configMapRef por secretRef e configMapKeyRef por secretKeyRef:
#   (a) envFrom.secretRef          -> DB_USER, DB_PASSWORD e DB_URL viram env
#   (b) env.valueFrom.secretKeyRef -> a mesma chave, renomeada para o nome que o
#       Spring Boot vai consumir quando o Postgres entrar (5.15/5.17)
# ConfigMap e Secret lado a lado no mesmo Pod: mesma mecanica, intencao diferente.
#
# A imagem continua a :v5 — nenhuma linha de codigo mudou nesta aula. Config e
# credencial sao dados; nao exigem rebuild.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellojava-secret
  labels:
    app: hellojava-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellojava-secret
  template:
    metadata:
      labels:
        app: hellojava-secret
    spec:
      containers:
      - name: hellojava
        image: hellojava:v5
        ports:
          - containerPort: 8080
        envFrom:
          - configMapRef:
              name: app-config      # config nao-sensivel (5.12)
          - secretRef:
              name: db-cred         # credencial (5.13)
        env:
          - name: SERVER_PORT
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: APP_PORT
          - name: DATABASE_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-cred
                key: DB_USER
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-cred
                key: DB_PASSWORD
