# Credencial do banco do AlgaDelivery — dado FAKE, criado para demonstrar a mecanica
# do Secret. A app desta aula nao le esses valores: o Postgres de verdade chega na
# 5.15/5.17, e ai estas MESMAS chaves passam a alimentar o datasource do Spring.
#
# stringData: voce escreve em TEXTO puro e o Kubernetes codifica em base64 sozinho.
# Equivalente imperativo:
#   kubectl create secret generic db-cred \
#     --from-literal=DB_USER=algadelivery \
#     --from-literal=DB_PASSWORD='s3nh4-super-secreta' \
#     --from-literal=DB_URL='jdbc:postgresql://algadelivery-db:5432/algadelivery'
#
# ATENCAO (bloco 2): este arquivo esta legivel e o valor no cluster esta em base64 —
# ou seja, ele NAO deveria ser commitado num repositorio real. Aqui e material de
# aula; em producao a fonte da verdade e um gestor externo (Modulo 9).
apiVersion: v1
kind: Secret
metadata:
  name: db-cred
type: Opaque
stringData:
  DB_USER: algadelivery
  DB_PASSWORD: s3nh4-super-secreta
  DB_URL: jdbc:postgresql://algadelivery-db:5432/algadelivery
