# Bloco 3 — catalogo de tipos. O `type` nao muda o armazenamento; ele diz ao
# Kubernetes o que ESPERAR nas chaves e onde o Secret pode ser usado.
# Estes exemplos sao para LER em aula (o Opaque dos outros arquivos e o que roda).
---
# 1. Opaque (default): chave->valor arbitrario. E o db-cred / api-token desta aula.
apiVersion: v1
kind: Secret
metadata:
  name: exemplo-opaque
type: Opaque
stringData:
  QUALQUER_CHAVE: qualquer-valor
---
# 2. kubernetes.io/dockerconfigjson: credencial de registry privado.
# Nao se escreve na mao — gera-se com:
#   kubectl create secret docker-registry regcred \
#     --docker-server=registry.exemplo.com --docker-username=usuario \
#     --docker-password='senha' --docker-email=eu@exemplo.com
# E no Pod nao entra como env nem volume: entra em imagePullSecrets.
#   spec:
#     imagePullSecrets:
#       - name: regcred
#
# 3. kubernetes.io/tls: par certificado + chave privada, nas chaves tls.crt e tls.key.
# Tambem gerado por comando (nunca colando chave privada em YAML versionado):
#   kubectl create secret tls algadelivery-tls --cert=tls.crt --key=tls.key
# E o que o Ingress vai consumir no Modulo 6 (na AWS o certificado vem do ACM).
#
# 4. kubernetes.io/service-account-token: token de identidade de uma ServiceAccount.
# Nao se cria na mao no dia a dia — o kubelet projeta o token no Pod. E a ponta
# que liga Secret a identidade e permissao (ServiceAccount + RBAC).
