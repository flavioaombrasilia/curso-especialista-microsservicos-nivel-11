# Estado FINAL do bloco 3: a credencial entregue como ARQUIVO.
# Cada chave do Secret vira um arquivo em /etc/secrets — igualzinho ao volume de
# ConfigMap da 5.12, so trocando `configMap:` por `secret:`.
#
# Por que a forma-arquivo e a preferida para credencial:
#   1. o valor NAO aparece em `kubectl exec -- env` (nem em dump de ambiente/crash);
#   2. o kubelet monta volume de Secret em tmpfs (RAM), nao no disco do node:
#        kubectl exec deployment/hellojava-secret -- df -h /etc/secrets
#   3. permissao restrita por defaultMode.
# E o padrao que o Postgres/JDBC vai usar na 5.17 (senha lida de arquivo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellojava-secret
  labels:
    app: hellojava-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellojava-secret
  template:
    metadata:
      labels:
        app: hellojava-secret
    spec:
      containers:
      - name: hellojava
        image: hellojava:v5
        ports:
          - containerPort: 8080
        envFrom:
          - configMapRef:
              name: app-config
        env:
          - name: SERVER_PORT
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: APP_PORT
          # as env da credencial SAIRAM: agora a senha chega so por arquivo
        volumeMounts:
          - name: credenciais
            mountPath: /etc/secrets
            readOnly: true
      volumes:
        - name: credenciais
          secret:
            secretName: db-cred
            # 0400: so o dono le. Credencial nao precisa ser legivel por todo mundo
            # dentro do container
            defaultMode: 0400
