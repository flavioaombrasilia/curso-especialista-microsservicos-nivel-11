apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellojava
  labels:
    app: hellojava
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: hellojava
  template:
    metadata:
      labels:
        app: hellojava
    spec:
      containers:
      - name: hellojava
        image: hellojava:v1
        ports:
          - containerPort: 8080
